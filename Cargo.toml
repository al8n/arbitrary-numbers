[package]
name = "numo"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/numo"
documentation = "https://docs.rs/numo"
description = "Exact fixed-point decimal numbers of up to 153 digits, or 154 with u512, with type-level digit counts and selectable integer storage, for no_std without allocation"
license = "MIT OR Apache-2.0"
keywords = ["decimal", "fixed-point", "exact", "typenum", "no-std"]
categories = ["mathematics", "no-std"]

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[dependencies]
typenum = { version = "1.20", features = ["const-generics"] }

[dev-dependencies]
criterion = "0.5"
num-bigint = "0.5"
proptest = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
